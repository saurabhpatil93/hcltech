services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATA_DIR: /workspace/data
      CHROMA_DIR: /workspace/data/chroma
      SQLITE_PATH: /workspace/data/retail.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      MOCK_LLM: ${MOCK_LLM:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes: ["./data:/workspace/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  ui:
    build: .
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    environment: {API_URL: "http://api:8000"}
    depends_on: [api]
    volumes: ["./data:/workspace/data"]
